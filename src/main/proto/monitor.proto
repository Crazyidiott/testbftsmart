syntax = "proto3";

option java_package = "bftsmart.demo.rlWrapper";
option java_outer_classname = "MonitorProto";

service MetricsService {
    rpc SendMetrics (MetricsRequest) returns (MetricsResponse);
    rpc GetCurrentParams (ParamsRequest) returns (MetricsResponse);
    rpc Connect (Timestamp) returns (Timestamp);
}

message ParamsRequest {
    int32 replicaId = 1;
}

message MetricsRequest {
    int32 throughput = 1;
    int32 latency = 2;
    int32 size = 3;
    int32 tot_thr = 4;
    int32 tot_lat = 5;
    int32 tot_size = 6;
    int32 option = 7;
    double arrival_rate = 8;
    // Drop statistics (per window)
    int64 flow_control_drops = 9;
    int64 seq_gap_rejects = 10;
    int64 in_queue_drops = 11;
    int64 out_queue_drops = 12;
    int64 oversized_drops = 13;
    // Consensus round latency (avg, in microseconds)
    int32 consensus_latency = 14;
}

message MetricsResponse {
    int32 BatchSize = 1;
    int32 BatchTimeout = 2;
    int32 RequestTimeout = 3;
}

message Timestamp {
    int64 timestamp = 1;
}